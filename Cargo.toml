[package]
name = "figma-mcp-rs"
version = "1.0.0"
edition = "2021"
description = "Figma MCP server in Rust — bridges MCP clients to Figma/FigJam via a plugin WebSocket"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util"] }
rmcp = { version = "3.2", features = ["server", "macros", "transport-io"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
hyper = { version = "1", features = ["http1", "client"] }
serde_json = "1"
base64 = "0.22"
parking_lot = "0.12"
regex = "1"
rand = "0.9"
lopdf = "0.45"
anyhow = "1"
schemars = "1"

[dev-dependencies]
tokio-tungstenite = "0.30"
tempfile = "3"

[profile.release]
strip = true
lto = true
