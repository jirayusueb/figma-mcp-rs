name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Build plugin
        working-directory: plugin
        run: |
          bun install --frozen-lockfile
          bun test
          bun run build
      - name: Fail if committed plugin/dist is stale
        run: git diff --exit-code plugin/dist
      - name: Zip plugin
        run: |
          mkdir -p dist-artifact
          zip -r dist-artifact/plugin.zip plugin/manifest.json plugin/dist
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: dist-artifact/plugin.zip

  build-binaries:
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, dir: darwin-arm64, exe: figma-mcp-rs }
          - { os: macos-15-intel, target: x86_64-apple-darwin, dir: darwin-amd64, exe: figma-mcp-rs }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, dir: linux-amd64, exe: figma-mcp-rs }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, dir: linux-arm64, exe: figma-mcp-rs }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, dir: windows-amd64, exe: figma-mcp-rs.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dir }}
          path: target/${{ matrix.target }}/release/${{ matrix.exe }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: echo "IMAGE_TAG=${TAG_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [build-plugin, build-binaries, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Arrange npm package
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          for dir in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64 windows-amd64; do
            mkdir -p npm/bin/$dir
            cp artifacts/$dir/* npm/bin/$dir/
            chmod +x npm/bin/$dir/figma-mcp-rs* 2>/dev/null || true
          done
          cd npm
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          " "$VERSION"
      - name: Attach plugin.zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/plugin/plugin.zip
      - name: Publish to npm
        working-directory: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish
